name: quotecage

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /var/quotecage/data
      WORK_DIR: /var/quotecage/work
      HOST_WORK_DIR: /var/quotecage/work
      ALLOW_DIR: /var/quotecage/allow
      DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_IMAGE: quotecage-sandbox:local
      SANDBOX_NETWORK: quotecage_sandbox
      EGRESS_PROXY: http://egress:3128
    volumes:
      - quotecage-data:/var/quotecage/data
      - /var/quotecage/work:/var/quotecage/work
      - /var/quotecage/allow:/var/quotecage/allow
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      fixtures:
        condition: service_healthy
      egress:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    networks: [app]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    restart: unless-stopped

  fixtures:
    build:
      context: .
      dockerfile: fixtures/Dockerfile
    ports:
      - "127.0.0.1:${FIXTURES_PORT:-8090}:80"
    networks:
      app: {}
      sandbox:
        aliases:
          - reedmill.fixtures
          - brightcartridge.fixtures
          - oakline.fixtures
          - quickquote.fixtures
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  egress:
    build:
      context: .
      dockerfile: egress/Dockerfile
    environment:
      ALLOW_FILE: /allow/egress-allow.json
      EGRESS_ALLOW_HOSTS: reedmill.fixtures,brightcartridge.fixtures,oakline.fixtures,quickquote.fixtures
    volumes:
      - /var/quotecage/allow:/allow:ro
    networks: [app, sandbox]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3128/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  sandbox-image:
    image: quotecage-sandbox:local
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    entrypoint: ["node"]
    command: ["-e", "console.log('quotecage sandbox image ready')"]
    restart: "no"
    networks: [app]

networks:
  app:
  sandbox:
    internal: true

volumes:
  quotecage-data:
